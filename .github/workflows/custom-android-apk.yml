name: Build Custom Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'core/**'
      - 'pubspec.yaml'
      - '.github/workflows/custom-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build-android:
    name: Build Android APK (Traffic Monitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android Signing (optional)
        if: ${{ secrets.KEYSTORE != '' }}
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Analyze Traffic Monitor Code
        run: flutter analyze --no-fatal-infos lib/features/traffic_monitor lib/manager/core_manager.dart lib/views/tools.dart

      - name: Fetch CA Certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart tool/package.dart android --env stable -v

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-TrafficMonitor-Android
          path: ./dist/*.apk
          overwrite: true

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="custom-latest"
          DATE_STR="$(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          NOTES="自动构建的 FlClash 流量监控定制版（构建时间：$DATE_STR）。内置「工具 → 流量统计」页面与 GitHub Gist 云同步。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./dist/*.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" ./dist/*.apk --title "FlClash 流量监控定制版 (Latest)" --notes "$NOTES"
          fi
