name: Build Custom Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'core/**'
      - 'pubspec.yaml'
      - '.github/workflows/custom-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build-android:
    name: Build Android APK (Traffic Monitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android Signing (optional)
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
            {
              echo "keyAlias=$KEY_ALIAS"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
            } >> android/local.properties
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Analyze Traffic Monitor Code
        run: flutter analyze --no-fatal-infos lib/features/traffic_monitor lib/manager/core_manager.dart lib/views/tools.dart

      - name: Fetch CA Certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Compute SemVer Release Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(sed -n 's/^version: *\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)"
          committed="$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)"
          IFS='.' read -r maj min pat <<< "$base"

          # Check existing vX.Y.Z releases in this repo and bump patch above the highest one
          latest_tag="$(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -n "$latest_tag" ]; then
            IFS='.' read -r lmaj lmin lpat <<< "${latest_tag#v}"
            if (( lmaj > maj || (lmaj == maj && lmin > min) || (lmaj == maj && lmin == min && lpat >= pat) )); then
              maj=$lmaj; min=$lmin; pat=$((lpat + 1))
            fi
          else
            pat=$((pat + 1))
          fi

          semver="${maj}.${min}.${pat}"
          build="$(date -u +%Y%m%d%H)"
          if ((build <= ${committed:-0})); then
            build=$((committed + 1))
          fi
          sed -i "s/^version: .*/version: ${semver}+${build}/" pubspec.yaml
          echo "version=${semver}" >> "$GITHUB_OUTPUT"
          echo "tag=v${semver}" >> "$GITHUB_OUTPUT"
          echo "Building standard SemVer v${semver} (versionCode ${build})"

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: dart tool/package.dart android --tag "$TAG" --env stable -v

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-TrafficMonitor-Android
          path: ./dist/*
          overwrite: true

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          DATE_STR="$(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          NOTES="FlClash 流量监控定制版 $TAG（构建时间：$DATE_STR）。含校验文件与固定签名，支持应用内「关于 → 检查更新」直接覆盖升级，保留全部配置与流量统计数据。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./dist/* --clobber
            gh release edit "$TAG" --notes "$NOTES" --latest
          else
            gh release create "$TAG" ./dist/* --title "FlClash 定制版 $TAG" --notes "$NOTES" --latest
          fi
